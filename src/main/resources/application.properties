spring.application.name=Cinebook

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${CINEBOOK_SECURE_COOKIES:true}
server.servlet.session.cookie.same-site=${CINEBOOK_SESSION_COOKIE_SAME_SITE:Lax}

cinebook.security.secure-cookies=${CINEBOOK_SECURE_COOKIES:true}
cinebook.security.cookie-same-site=${CINEBOOK_SESSION_COOKIE_SAME_SITE:Lax}
cinebook.security.allowed-origins=${CINEBOOK_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
cinebook.auth.migrate-plaintext-passwords=${CINEBOOK_MIGRATE_PLAINTEXT_PASSWORDS:true}
logging.level.org.springframework.security=TRACE
server.forward-headers-strategy=framework